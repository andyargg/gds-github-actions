# Configuración del análisis de SonarCloud (la lee el step "Análisis SonarCloud" de ci.yml)

# Identificación del proyecto en SonarCloud
sonar.organization=andyargg
sonar.projectKey=andyargg_gds-github-actions
sonar.projectName=gds-github-actions

# Qué se analiza: código de la app y código de tests por separado
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Reporte de cobertura generado por pytest-cov en el step de tests
sonar.python.coverage.reportPaths=coverage.xml

# Esperar el resultado del Quality Gate y hacer fallar el step si no se cumple
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
