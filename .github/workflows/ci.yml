# =====================================================================
# Workflow de Integración Continua (CI)
# En cada pull request contra main:
#   1. Ejecuta la suite de tests con pytest (testing dinámico).
#   2. Analiza el código con SonarCloud (análisis estático / SAST) y
#      espera el resultado de su Quality Gate.
# Su resultado se usa como "status check" requerido por la branch
# protection rule de main: si fallan los tests o el Quality Gate,
# no se puede mergear.
# =====================================================================

# Nombre del workflow: aparece en la pestaña Actions y en el PR
name: CI

# ---------------------------------------------------------------------
# TRIGGERS (eventos que disparan el workflow)
# ---------------------------------------------------------------------
on:
  # Evento principal: se ejecuta al abrir un PR contra main y en cada
  # nuevo push a la rama de ese PR. Es lo que lo convierte en quality gate.
  pull_request:
    branches: [main]
  # También al integrar cambios en main, para que el badge del README
  # refleje el estado actual de la rama principal.
  push:
    branches: [main]
  # Permite ejecutarlo manualmente desde la pestaña Actions.
  workflow_dispatch:

# ---------------------------------------------------------------------
# JOBS: unidades de trabajo que corren en un runner
# ---------------------------------------------------------------------
jobs:
  # El nombre del job ("tests") es el nombre del status check que
  # se exige en la branch protection rule.
  tests:
    # RUNNER: máquina virtual Ubuntu hospedada por GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # STEPS: pasos que se ejecutan en orden dentro del job.
    # Cada step usa una ACTION reutilizable (uses) o un comando (run).
    steps:
      # 1) Descarga el código del repositorio en el runner.
      #    fetch-depth: 0 baja el historial completo: SonarCloud lo usa
      #    para distinguir el código nuevo del PR del código existente.
      - name: Checkout del código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2) Instala la versión de Python indicada
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) Cache de paquetes pip. La clave depende del hash de
      #    requirements.txt: si no cambió, se reutiliza el cache y la
      #    instalación es más rápida. restore-keys permite usar un cache
      #    parcial anterior si la clave exacta no existe.
      - name: Cache de dependencias pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      # 4) Instala las dependencias del proyecto
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 5) Ejecuta la suite de tests. Genera un reporte HTML (pytest-html)
      #    y reportes de cobertura (pytest-cov): HTML para leerlo y XML
      #    (coverage.xml) para que SonarCloud calcule la cobertura.
      #    Si algún test falla, pytest devuelve código de salida != 0,
      #    el step falla y el check del PR queda en rojo.
      - name: Ejecutar tests
        run: >
          pytest
          --html=reports/report.html --self-contained-html
          --cov=app --cov-report=html:reports/coverage
          --cov-report=xml:coverage.xml --cov-report=term

      # 6) Análisis estático con SonarCloud, después de los tests.
      #    El scanner lee la configuración de sonar-project.properties,
      #    analiza el código (bugs, vulnerabilidades, code smells,
      #    duplicación) y sube coverage.xml. Como sonar.qualitygate.wait
      #    está activado, espera el veredicto del Quality Gate: si el
      #    código nuevo no lo cumple, el step falla y el merge se bloquea.
      #    SONAR_TOKEN es un secret del repo (no queda visible en el código).
      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 7) Publica los reportes como ARTIFACT descargable desde la corrida.
      #    "!cancelled()" hace que se suban también cuando los tests fallan,
      #    para poder ver qué test se rompió.
      - name: Publicar reporte de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/
          retention-days: 30
