# CI: corre los tests y el analisis de SonarCloud en cada PR a main.
# Si algo falla, el PR no se puede mergear (main esta protegida).

name: CI

# Cuando se ejecuta
on:
  pull_request:        # al abrir o actualizar un PR a main
    branches: [main]
  push:                # al mergear a main (para el badge del README)
    branches: [main]
  workflow_dispatch:   # para correrlo a mano desde Actions

jobs:
  # "tests" es el nombre del check que pide la proteccion de main
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Baja el codigo. fetch-depth: 0 trae todo el historial,
      # Sonar lo necesita para saber que codigo es nuevo
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Guarda los paquetes de pip para que la proxima vez instale mas rapido
      - name: Cache de dependencias pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Corre los tests y genera la cobertura.
      # coverage.xml es el archivo que despues lee Sonar
      - name: Ejecutar tests
        run: >
          pytest
          --html=reports/report.html --self-contained-html
          --cov=app --cov-report=html:reports/coverage
          --cov-report=xml:coverage.xml --cov-report=term

      # Analisis estatico con SonarCloud (config en sonar-project.properties).
      # Espera el resultado del Quality Gate: si falla, falla este paso.
      # El token esta guardado como secret del repo
      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Sube los reportes para descargarlos desde la corrida.
      # Se sube aunque fallen los tests, asi se ve que fallo
      - name: Publicar reporte de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/
          retention-days: 30
